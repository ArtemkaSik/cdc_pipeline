apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-connect
  namespace: kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-connect
  template:
    metadata:
      labels:
        app: kafka-connect
    spec:
      enableServiceLinks: false
      initContainers:
        - name: install-plugins
          image: confluentinc/cp-kafka-connect:7.6.0
          securityContext:
            runAsUser: 0
          command:
            - sh
            - -c
            - |
              confluent-hub install --no-prompt --component-dir /data/plugins debezium/debezium-connector-postgresql:2.5.4
              
              confluent-hub install --no-prompt --component-dir /data/plugins debezium/debezium-connector-mysql:latest
              
              confluent-hub install --no-prompt --component-dir /data/plugins confluentinc/kafka-connect-jdbc:latest
              
              mkdir -p /data/plugins/confluentinc-kafka-connect-jdbc/lib
              
              curl -L -o /data/plugins/confluentinc-kafka-connect-jdbc/lib/mysql-connector-j.jar https://repo1.maven.org/maven2/com/mysql/mysql-connector-j/8.0.33/mysql-connector-j-8.0.33.jar

          volumeMounts:
            - name: connect-plugins
              mountPath: /data/plugins
      containers:
        - name: kafka-connect
          image: confluentinc/cp-kafka-connect:7.6.0
          ports:
            - containerPort: 8083
              name: rest-api
          env:
            - name: CONNECT_BOOTSTRAP_SERVERS
              value: "PLAINTEXT://kafka-0-0.kafka-cluster.kafka.svc.cluster.local:9092"
            - name: CONNECT_REST_PORT
              value: "8083"
            - name: CONNECT_GROUP_ID
              value: "debezium-cluster"
            - name: CONNECT_CONFIG_STORAGE_TOPIC
              value: "debezium_connect_configs"
            - name: CONNECT_OFFSET_STORAGE_TOPIC
              value: "debezium_connect_offsets"
            - name: CONNECT_STATUS_STORAGE_TOPIC
              value: "debezium_connect_statuses"
            - name: CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR
              value: "1"
            - name: CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR
              value: "1"
            - name: CONNECT_STATUS_STORAGE_REPLICATION_FACTOR
              value: "1"
            - name: CONNECT_KEY_CONVERTER
              value: "io.confluent.connect.avro.AvroConverter"
            - name: CONNECT_KEY_CONVERTER_SCHEMA_REGISTRY_URL
              value: "http://schema-registry.kafka.svc.cluster.local:8081"
            - name: CONNECT_VALUE_CONVERTER
              value: "io.confluent.connect.avro.AvroConverter"
            - name: CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL
              value: "http://schema-registry.kafka.svc.cluster.local:8081"
            - name: CONNECT_REST_ADVERTISED_HOST_NAME
              value: "kafka-connect"
            - name: CONNECT_PLUGIN_PATH
              value: "/usr/share/java,/usr/share/confluent-hub-components,/data/plugins"
          volumeMounts:
            - name: connect-plugins
              mountPath: /data/plugins
      volumes:
        - name: connect-plugins
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-connect
  namespace: kafka
spec:
  selector:
    app: kafka-connect
  ports:
    - port: 8083
      targetPort: 8083
  type: ClusterIP
